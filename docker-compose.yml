services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ambulance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ambulance
      POSTGRES_PASSWORD: ambulance123
      POSTGRES_DB: ambulance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: